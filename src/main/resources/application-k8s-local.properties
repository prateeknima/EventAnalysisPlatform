# Local Kubernetes smoke-test profile.
#
# Purpose:
# - run the API pod in minikube
# - use Docker Compose dependencies on the host machine
# - avoid running the full dependency stack inside minikube
# - verify that the GHCR image starts successfully in Kubernetes

spring.kafka.bootstrap-servers=host.minikube.internal:9092
spring.kafka.listener.auto-startup=false
app.kafka.listeners.enabled=false

spring.data.redis.host=host.minikube.internal
spring.data.redis.port=6379

spring.datasource.url=jdbc:postgresql://host.minikube.internal:5432/incidents
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.flyway.enabled=false

spring.elasticsearch.uris=http://host.minikube.internal:9200
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://host.minikube.internal:8081/realms/event-analysis

management.health.db.enabled=false
management.health.redis.enabled=false
management.health.elasticsearch.enabled=false
