# application.properties

spring.application.name=EventAnalysisPlatform

# Kafka broker location
spring.kafka.bootstrap-servers=localhost:9092

# Consumer group identifier
spring.kafka.consumer.group-id=incident-group

# Start from earliest offset when no committed offsets exist
spring.kafka.consumer.auto-offset-reset=earliest

# Deserialize Kafka message keys as strings
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Deserialize Kafka message values as strings
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.datasource.url=jdbc:postgresql://localhost:5432/incidents
spring.datasource.username=postgres
spring.datasource.password=postgres

logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.flyway=DEBUG
debug=true
