global:
  resolve_timeout: 5m

route:
  receiver: slack-alerts
  group_by:
    - alertname
    - service
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 30m

receivers:
  - name: slack-alerts
    slack_configs:
      - api_url_file: /etc/alertmanager/slack-webhook-url
        channel: "#alerts"
        send_resolved: true
        title: "{{ .CommonLabels.alertname }} - {{ .CommonLabels.severity }}"
        text: "{{ .CommonAnnotations.summary }}\n{{ .CommonAnnotations.description }}"