groups:
  - name: event-analysis-platform
    rules:
      - alert: EventAnalysisApiMetricsDown
        expr: up{job="event-analysis-platform"} == 0
        for: 1m
        labels:
          severity: critical
          service: event-analysis-platform
        annotations:
          summary: "Event Analysis Platform metrics are down"
          description: "Prometheus cannot scrape the Spring Boot actuator metrics endpoint."

      - alert: EventAnalysisPostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          service: postgres
        annotations:
          summary: "PostgreSQL exporter is down"
          description: "Prometheus cannot scrape PostgreSQL exporter metrics."

      - alert: EventAnalysisRedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis exporter is down"
          description: "Prometheus cannot scrape Redis exporter metrics."

      - alert: EventAnalysisElasticsearchDown
        expr: up{job="elasticsearch"} == 0
        for: 1m
        labels:
          severity: critical
          service: elasticsearch
        annotations:
          summary: "Elasticsearch exporter is down"
          description: "Prometheus cannot scrape Elasticsearch exporter metrics."

      - alert: EventAnalysisJvmHeapHigh
        expr: |
          sum(jvm_memory_used_bytes{area="heap"})
          /
          sum(jvm_memory_max_bytes{area="heap"})
          > 0.85
        for: 10m
        labels:
          severity: warning
          service: event-analysis-platform
        annotations:
          summary: "JVM heap usage is high"
          description: "JVM heap usage has been above 85% for 10 minutes."

      - alert: EventAnalysisApiHighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          sum(rate(http_server_requests_seconds_count[5m]))
          > 0.01
        for: 5m
        labels:
          severity: warning
          service: event-analysis-platform
        annotations:
          summary: "High API 5xx error rate"
          description: "More than 1% of API requests have returned 5xx responses for 5 minutes."

      - alert: EventAnalysisApiHighPostLatency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_server_requests_seconds_bucket{uri="/incidents", method="POST"}[5m])) by (le)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          service: event-analysis-platform
        annotations:
          summary: "High POST /incidents latency"
          description: "p95 latency for POST /incidents is above 500ms for 5 minutes."

      - alert: EventAnalysisApiHighSearchLatency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_server_requests_seconds_bucket{uri="/incidents/search", method="GET"}[5m])) by (le)
          ) > 0.4
        for: 5m
        labels:
          severity: warning
          service: event-analysis-platform
        annotations:
          summary: "High search latency"
          description: "p95 latency for GET /incidents/search is above 400ms for 5 minutes."

      - alert: EventAnalysisKafkaConsumerLagHigh
        expr: kafka_consumergroup_lag{consumergroup="incident-group"} > 100
        for: 5m
        labels:
          severity: warning
          service: event-analysis-platform
        annotations:
          summary: "Kafka consumer lag is high"
          description: "Kafka consumer group incident-group has lag above 100 messages for 5 minutes."